#update according to project flavors
instructions:
  - assets:download
  - assets:extract
  - android:androidManifest
  - android:flavorizrGradle
  - android:buildGradle
  - android:dummyAssets
  - android:icons
  - ios:podfile
  - ios:xcconfig
  - ios:buildTargets
  - ios:schema
  - ios:dummyAssets
  - ios:icons
  - ios:plist
  - ios:launchScreen
  - google:firebase
  - assets:clean

flavors:
  dev:
    app:
      name: "[Dev] App"
    android:
      applicationId: "com.hropal.app.dev"
      firebase:
        config: "firebase/dev/google-services.json"
    ios:
      bundleId: "com.hropal.app.dev"
      firebase:
        config: "firebase/dev/GoogleService-Info.plist"

  staging:
    app:
      name: "[Staging] App"
    android:
      applicationId: "com.hropal.app.staging"
      firebase:
        config: "firebase/staging/google-services.json"
    ios:
      bundleId: "com.hropal.app.staging"
      firebase:
        config: "firebase/staging/GoogleService-Info.plist"

  prod:
    app:
      name: "APP"
    android:
      applicationId: "com.hropal.app"
    ios:
      bundleId: "com.hropal.app"
