#update according to project flavors
flavors:
  dev:
    app:
      name: "[Dev] HR Opal"
    android:
      applicationId: "com.hropal.app.dev"
      firebase:
        config: "firebase/dev/google-services.json"
    ios:
      bundleId: "com.hropal.app.dev"
      firebase:
        config: "firebase/dev/GoogleService-Info.plist"

  staging:
    app:
      name: "[Staging] HR Opal"
    android:
      applicationId: "com.hropal.app.staging"
      firebase:
        config: "firebase/staging/google-services.json"
    ios:
      bundleId: "com.hropal.app.staging"
      firebase:
        config: "firebase/staging/GoogleService-Info.plist"

  prod:
    app:
      name: "HR Opal"
    android:
      applicationId: "com.hropal.app"
      firebase:
        config: "firebase/prod/google-services.json"
    ios:
      bundleId: "com.hropal.app"
      firebase:
        config: "firebase/prod/GoogleService-Info.plist"
